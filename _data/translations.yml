kn:
  title: "ಎಸ್.ವಿ.ಎಸ್ ಪ್ರೌಢಶಾಲೆ, ಆಗುಂಬೆ"
  nav:
    story: "ನಮ್ಮ ಕಥೆ"
    renovation: "ನವೀಕರಣ"
    contact: "ಸಂಪರ್ಕಿಸಿ"
    results_badge: "೧೦೦% ಫಲಿತಾಂಶ"
    alumni_reg: "ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳ ನೋಂದಣಿ"
    contribute: "ದೇಣಿಗೆ ನೀಡಿ"
  hero:
    badge: "ಹಂತ 1 ರ ನವೀಕರಣ ಪ್ರಗತಿಯಲ್ಲಿದೆ"
    title: "ಎಸ್.ವಿ.ಎಸ್ ಆಗುಂಬೆಯ ಪರಂಪರೆಯನ್ನು ಪುನರ್ನಿರ್ಮಿಸಲು ಸಹಾಯ ಮಾಡಿ"
    desc: "1965 ರಲ್ಲಿ ಸ್ಥಾಪಿತವಾದ ನಮ್ಮ ಶಾಲೆ ಸಾವಿರಾರು ಕನಸುಗಳಿಗೆ ಆಸರೆಯಾಗಿದೆ. ಇಂದು ಆ ಗೋಡೆಗಳಿಗೆ ನಿಮ್ಮ ಬೆಂಬಲ ಬೇಕಾಗಿದೆ. ನಮ್ಮ ಪ್ರೀತಿಯ ಶಾಲೆಯನ್ನು ಪುನಃಸ್ಥಾಪಿಸಲು ನಮ್ಮ ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳ ನೆಟ್‌ವರ್ಕ್‌ಗೆ ಸೇರಿಕೊಳ್ಳಿ."
    donate_btn: "ಈಗಲೇ ದೇಣಿಗೆ ನೀಡಿ"
    progress_btn: "ಪ್ರಗತಿಯನ್ನು ವೀಕ್ಷಿಸಿ"
  story:
    title: "ನಮ್ಮ ಕಥೆ"
    subtitle: "ಆಗುಂಬೆ ಸಮುದಾಯಕ್ಕೆ 60 ಕ್ಕೂ ಹೆಚ್ಚು ವರ್ಷಗಳಿಂದ ಸೇವೆ ಸಲ್ಲಿಸುತ್ತಿದೆ."
    card1_title: "1965 ರಲ್ಲಿ ಸ್ಥಾಪನೆ"
    card1_desc: "ಮಲೆನಾಡು ಪ್ರದೇಶಕ್ಕೆ ಗುಣಮಟ್ಟದ ಶಿಕ್ಷಣವನ್ನು ನೀಡುವ ದೃಷ್ಟಿಯೊಂದಿಗೆ ಸ್ಥಾಪಿಸಲಾಗಿದೆ."
    card2_title: "75 ವಿದ್ಯಾರ್ಥಿಗಳು"
    card2_desc: "ಪ್ರಸ್ತುತ ಆಗುಂಬೆ ಮತ್ತು ಸುತ್ತಮುತ್ತಲಿನ ಹಳ್ಳಿಗಳ ಪ್ರತಿಭಾವಂತ ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಶಿಕ್ಷಣ ನೀಡಲಾಗುತ್ತಿದೆ."
    card3_title: "8 ರಿಂದ 10 ನೇ ತರಗತಿಗಳು"
    card3_desc: "ಪ್ರಮುಖ ಪ್ರೌಢಶಾಲಾ ಶಿಕ್ಷಣದ ಭದ್ರ ಬುನಾದಿಯನ್ನು ಒದಗಿಸುತ್ತಿದೆ."
  message:
    badge: "ಒಂದು ವಿನಮ್ರ ಮನವಿ"
    title: "ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ, ಶಿಕ್ಷಣ ಆಸಕ್ತರಿಗೆ ಮತ್ತು ದಾನಿಗಳಿಗೆ"
    p1: "ಪ್ರಾರಂಭದಿಂದಲೂ, ಎಸ್.ವಿ.ಎಸ್. ಪ್ರೌಢಶಾಲೆಯು ಉಚಿತ ಶಿಕ್ಷಣವನ್ನು ನೀಡುತ್ತಿದೆ. ಇಂದು ನಾವು 8 ರಿಂದ 10 ನೇ ತರಗತಿಯವರೆಗೆ 75 ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು ಹೊಂದಿದ್ದೇವೆ. ನಾವು ಸರ್ಕಾರಿ ಅನುದಾನಿತ ಸಂಸ್ಥೆಯಾಗಿದ್ದರೂ, ಪ್ರಸ್ತುತ ನಮಗೆ ಐದು ಶಿಕ್ಷಕರಿಗೆ ಮಾತ್ರ ಸಂಬಳದ ಅನುದಾನ ಸಿಗುತ್ತಿದೆ, ಹೆಚ್ಚುವರಿ ಸರ್ಕಾರಿ ಧನಸಹಾಯವಿಲ್ಲ. ನಮ್ಮ ವಿದ್ಯಾರ್ಥಿಗಳ ಶಿಕ್ಷಣವು ಯಾವುದೇ ಅಡೆತಡೆಯಿಲ್ಲದೆ ಮುಂದುವರಿಯುವುದನ್ನು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಲು, ಆಡಳಿತ ಮಂಡಳಿಯು ನಾಲ್ಕು ಹೆಚ್ಚುವರಿ ತಾತ್ಕಾಲಿಕ ಶಿಕ್ಷಕರ ಸಂಬಳವನ್ನು ಪಾವತಿಸಲು ದಾನಿಗಳ ಔದಾರ್ಯವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಅವಲಂಬಿಸಿದೆ."
    p2: "ಗುಣಮಟ್ಟದ ಶಿಕ್ಷಣಕ್ಕೆ ನಮ್ಮ ಬದ್ಧತೆಯನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಲು, ನಮ್ಮ ಸೌಲಭ್ಯಗಳನ್ನು ಮೇಲ್ದರ್ಜೆಗೆ ಏರಿಸುವುದು ಅನಿವಾರ್ಯವಾಗಿದೆ. ನಮ್ಮ ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಕಟ್ಟಡವು ಶಿಥಿಲಾವಸ್ಥೆಯಲ್ಲಿದ್ದು ತಕ್ಷಣದ ದುರಸ್ತಿ ಅಗತ್ಯವಿದೆ. ಇದಲ್ಲದೆ, ನಮಗೆ ಶೌಚಾಲಯಗಳು, ನೀರಿನ ಟ್ಯಾಂಕ್ ಮತ್ತು ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯಗಳನ್ನು ನಿರ್ಮಿಸುವ ತುರ್ತು ಅಗತ್ಯವಿದೆ. ಕಂಪ್ಯೂಟರ್‌ಗಳು, ಡಿಜಿಟಲ್ ಪ್ರೊಜೆಕ್ಟರ್‌ಗಳು, ಸಿಸಿಟಿವಿ ಕ್ಯಾಮೆರಾಗಳು ಮತ್ತು ಮೂಲಭೂತ ಪೀಠೋಪಕರಣಗಳು ಸೇರಿದಂತೆ ಆಧುನಿಕ ಕಲಿಕಾ ಪರಿಕರಗಳನ್ನು ನಾವು ತರಗತಿ ಕೊಠಡಿಗಳಿಗೆ ಒದಗಿಸಬೇಕಾಗಿದೆ."
    p3: "ಈ ಶಾಲೆಯ ಪ್ರಗತಿಯು ಯಾವಾಗಲೂ ನಮ್ಮ ದಾನಿಗಳು ಮತ್ತು ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳ ನಿಸ್ವಾರ್ಥ ಬೆಂಬಲದಿಂದ ಪ್ರೇರೇಪಿಸಲ್ಪಟ್ಟಿದೆ. ನಮ್ಮ ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳು ನೀಡಿದ ಅಪಾರ ಆರ್ಥಿಕ ಮತ್ತು ನೈತಿಕ ಬೆಂಬಲಕ್ಕೆ ನಾವು ಆಳವಾಗಿ ಕೃತಜ್ಞರಾಗಿದ್ದೇವೆ. ಆದರೆ ಗುರಿಯನ್ನು ಇನ್ನೂ ತಲುಪಲಾಗಿಲ್ಲ, ಮತ್ತು ಅಲ್ಲಿಗೆ ತಲುಪಲು ನಿಮ್ಮೆಲ್ಲರ ಬೆಂಬಲ ನಮಗೆ ಬೇಕು."
    sign_off: "ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳು, ಪೋಷಕರು, ಮುಖ್ಯೋಪಾಧ್ಯಾಯರು ಮತ್ತು ಬೋಧಕ ಸಿಬ್ಬಂದಿ"
    trust: "ಆಗುಂಬೆ ಶಿಕ್ಷಣ ಟ್ರಸ್ಟ್"
  gallery:
    title: "ನವೀಕರಣ ಕಾರ್ಯ ನಡೆಯುತ್ತಿದೆ"
    desc: "ಅಮೂಲ್ಯವಾದ ಪಾಠಗಳು, ನೆನಪುಗಳು ಮತ್ತು ಪ್ರಗತಿಯಲ್ಲಿರುವ ಕೆಲಸಗಳು. ನಮ್ಮ ನವೀಕರಣ ಗ್ಯಾಲರಿಯನ್ನು ಅನ್ವೇಷಿಸಲು ಕ್ಲಿಕ್ ಮಾಡಿ."
