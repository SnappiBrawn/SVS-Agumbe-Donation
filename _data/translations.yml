    badge: "A Humble Appeal"
    title: "To the Alumni, Education Enthusiasts and Philanthropists"
    p1: "Since its inception, S.V.S. High School has provided free education. Today, we have 75 students across the 8th to 10th standards. Although we are a government-aided institution, we currently receive salary grants for only five teachers, with no additional government funding. To ensure our students' education remains uninterrupted, the Management Board relies entirely on donor generosity to pay the salaries of four additional temporary teachers."
    p2: "To maintain our commitment to quality education, it has become inevitable that we upgrade our facilities. Our existing building is dilapidated and requires immediate repair. Furthermore, we urgently need to construct proper restrooms, a water tank, and science laboratories. We also must equip our classrooms with modern learning tools, including computers, digital projectors, CCTV cameras, and basic furniture."
    p3: "The progress of this school has always been fueled by the selfless support of our donors and alumni. We are deeply grateful for the overwhelming financial and moral support pledged by our alumni. But the goal has not been met yet, and to get there, we need all your support."
