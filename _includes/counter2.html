<section id="donation-tracker" class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="tracker-card p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="section-title mb-2">Help Us Rebuild Our Legacy</h2>
            <p class="text-muted">Every rupee brings us closer to a modern campus.</p>
          </div>

          <div class="d-flex justify-content-center align-items-center mb-3">
            <div class="gap-display">
              <span class="gap-label">Amount Needed to Reach Goal</span>
              <div class="gap-amount" id="gap-amount">₹0</div>
            </div>
          </div>

          <div class="progress-wrapper mb-2">
            <div class="progress-fill" id="progress-fill" role="progressbar" style="width: 0%"></div>
          </div>

          <div class="text-end mb-4"><span class="fw-bold text-success-custom" id="percentage-label">0%</span> Funded</div>

          <div class="row text-center border-top pt-4">
            <div class="col-6 col-md-6 border-end">
              <h5 class="stat-label">Raised So Far</h5>
              <div class="stat-value text-success-custom" id="raised-amount" data-value="500000">₹0</div>
            </div>
            <div class="col-6 col-md-6">
              <h5 class="stat-label">Total Goal</h5>
              <div class="stat-value text-primary-custom" id="goal-amount">₹0</div>
            </div>
          </div>

          <div class="text-center mt-5">
            <button class="btn btn-cta btn-lg shadow" data-bs-toggle="modal" data-bs-target="#paymentModal">Make a Donation <i class="fas fa-heart ms-2"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
