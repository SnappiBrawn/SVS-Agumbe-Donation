  invest:
    title: "ಮಗುವಿನ ಭವಿಷ್ಯದಲ್ಲಿ ಹೂಡಿಕೆ ಮಾಡಿ"
    desc: "ಸಂಪರ್ಕಿತ ನವೀಕರಣದ ಒಟ್ಟು ಅಂದಾಜು ವೆಚ್ಚ ಸುಮಾರು ₹62 ಲಕ್ಷಗಳು. ತಕ್ಷಣದ ಅಗತ್ಯತೆಗಳ ವಿವರ ಇಲ್ಲಿದೆ. ಪಾರದರ್ಶಕತೆ ನಮ್ಮ ಆದ್ಯತೆಯಾಗಿದೆ."
    how_to_donate: "ದೇಣಿಗೆ ನೀಡುವುದು ಹೇಗೆ?"
    how_to_donate_desc: "ನೀವು ನೇರವಾಗಿ ಯುಪಿಐ (UPI) ಅಥವಾ ಬ್ಯಾಂಕ್ ವರ್ಗಾವಣೆ ಮೂಲಕ ಹಣವನ್ನು ವರ್ಗಾಯಿಸಬಹುದು."
    table_cause: "ಕಾರಣ / ಅವಶ್ಯಕತೆ"
    table_cost: "ಅಂದಾಜು ವೆಚ್ಚ"
    row1_title: "ಸಿಸಿ ಕ್ಯಾಮೆರಾ ವ್ಯವಸ್ಥೆ"
    row1_desc: "ವಿದ್ಯಾರ್ಥಿಗಳ ಸುರಕ್ಷತೆ ಮತ್ತು ಭದ್ರತೆಗಾಗಿ"
    row2_title: "ಲ್ಯಾಪ್ಟಾಪ್ಗಳು"
